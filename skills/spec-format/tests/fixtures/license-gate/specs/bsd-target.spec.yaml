# A BSD target-side citation (synthetic license-gate fixture; format 2 of the v1 bsd-target-spec.md)
format: 2
kind: peripheral
id: gate-bsd-target
name: Widget block, bsd-target
triggers: [gate bsd target]
resources:
  documents:
    - {name: widget-trm, class: databook, title: Widget TRM v1.0, url: "https://example.invalid/widget-trm.pdf", pages: 80}
  repos:
    - name: os
      url: https://example.invalid/os
      commit: "4444444444444444444444444444444444444444"
      license: BSD-3-Clause
      role: target
      files: [{path: drivers/widget/widget.cc, license_from: spdx-line}]
facts:
