# A chip that cites a document only: fits every root (format 2 of the v1 widgetchip.spec.md).
format: 2
kind: chip
id: widgetchip
name: Widget Chip
triggers: [widgetchip]
resources:
  documents:
    - {name: widget-trm, class: databook, title: Widget TRM v1.0, url: "https://example.invalid/widget-trm.pdf", pages: 80}
facts:
  - id: reset-time
    section: quick-facts
    title: Reset time
    claim: The chip resets in 10 us.
    support: [{class: databook, doc: widget-trm, at: [{section: "4.2", page: "40"}]}]
