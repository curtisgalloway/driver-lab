# A repos entry whose license is not SPDX (synthetic license-gate fixture; format 2 of the v1 invalid-license-spec.md)
format: 2
kind: peripheral
id: gate-invalid-license
name: Widget block, invalid-license
triggers: [gate invalid license]
resources:
  documents:
    - {name: widget-trm, class: databook, title: Widget TRM v1.0, url: "https://example.invalid/widget-trm.pdf", pages: 80}
  repos:
    - name: linux
      url: https://example.invalid/linux
      commit: "1111111111111111111111111111111111111111"
      license: mainline
      files: [{path: drivers/widget.c, license_from: spdx-line}]
facts:
  - id: ctrl-offset
    section: identity
    title: CTRL offset
    claim: CTRL is at offset 0x10.
    support:
      - class: src
        anchors: [{repo: linux, path: drivers/widget.c, lines: [2, 2], symbol: WIDGET_CTRL}]
