# SPDX-License-Identifier: Apache-2.0
# A board with not_triggers, two variants (one known only from press), a series, a document
# fetched in part, a claim whose code span holds angle brackets, and a tool driven by a skill
# the test names public.
format: 2
kind: board
id: widgetboard
name: Widget Board
triggers: [widget board, widgetboard]
not_triggers: [widget board 2]
aliases: [wb1]
parts: [widgetsoc]
cache: widget-resources
variants:
  - id: widgetboard-lite
    name: Widget Board Lite
    triggers: [widget board lite]
    shares: [soc, console]
    differs: half the DRAM
    support: [{class: doc, doc: widget-product-page, at: [{heading: Models}]}]
  - id: widgetboard-pro
    name: Widget Board Pro
    triggers: [widget board pro]
    shares: [soc]
    differs: a faster clock, reported only by press
    support: [{class: press, title: Widget Board Pro announced, url: "https://example.invalid/news/pro"}]
    todo: {check: document, text: find a vendor page naming the Pro model.}
resources:
  documents:
    - name: widget-product-page
      class: doc
      title: Widget Board product page
      url: https://example.invalid/widgetboard
      access: public
      fetch: partial
  repos:
    - name: widget-linux
      url: https://example.invalid/widget-linux
      ref: main
      license: GPL-2.0-only
      note: a map, never cited
  series:
    - {title: Add Widget SoC, url: "https://example.invalid/lists/widget-soc", target: widget-linux, status: unmerged}
  tools:
    - {kind: bench, name: widget-bench-1, via: "skill:widget-board-tools"}
facts:
  - id: debug-console
    section: quick-facts
    title: Debug console
    critical: true
    claim: The console is UART0; the tree spells its interrupt `<0 121 4>`, and `<type number flags>` is the tuple.
    support:
      - {class: doc, doc: widget-product-page, at: [{heading: Debug header}]}
    relates: [{fact: "widgetsoc#uart-base", relation: refines}]
