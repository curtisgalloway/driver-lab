    section: identity
    title: Reset time
    claim: The block resets in 10 us.
    support: [{class: databook, doc: widget-trm, at: [{section: "4.2", page: "40"}]}]
  - id: target-binding
    section: target
    claim: The driver binds by compatible string.
    note: "Format 1 citation: [tgt: drivers/widget/widget.cc:12]. No symbol was recorded; the search is scoped to that file."
    support:
      - class: src
        anchors: [{repo: os, path: drivers/widget/widget.cc, search: compatible}]
