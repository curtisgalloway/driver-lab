# Defect: a citation of a document the file does not list.
format: 2
kind: chip
id: doc-unresolved
name: Doc-Unresolved
triggers: [doc-unresolved]
resources:
  documents:
    - {name: widget-trm, class: databook, title: Widget TRM v1.0, url: "https://example.invalid/widget-trm.pdf", pages: 80}
facts:
  - id: cited
    section: quick-facts
    title: Cited
    claim: A cited value.
    support: [{class: databook, doc: nosuchdoc, at: [{section: "1"}]}]
