# Defect: a doc citation of a databook-class document.
format: 2
kind: chip
id: doc-class
name: Doc-Class
triggers: [doc-class]
resources:
  documents:
    - {name: widget-trm, class: databook, title: Widget TRM v1.0, url: "https://example.invalid/widget-trm.pdf", pages: 80}
facts:
  - id: cited
    section: quick-facts
    title: Cited
    claim: A cited value.
    support: [{class: doc, doc: widget-trm, at: [{heading: Reset}]}]
