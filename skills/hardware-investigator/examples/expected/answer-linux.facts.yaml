format: 2
kind: facts
resources:
  repos:
  - name: linux
    url: https://example.invalid/linux
    commit: '1111111111111111111111111111111111111111'
    license: GPL-2.0-only
    role: source
    files:
    - path: drivers/tty/serial/widget.c
      license_from: spdx-line
facts:
- id: reg-ctrl
  section: facts
  title: CTRL
  data:
    register:
      name: WIDGET_CTRL
      offset: '0x0'
      width: 32
      access: rw
      reset: '0x0'
    fields:
    - id: en
      name: WIDGET_CTRL_EN
      bits:
      - 0
      - 0
      meaning: block enable
      support:
      - class: src
        anchors:
        - repo: linux
          path: drivers/tty/serial/widget.c
          lines:
          - 5
          - 5
          symbol: WIDGET_CTRL_EN
  support:
  - class: src
    anchors:
    - repo: linux
      path: drivers/tty/serial/widget.c
      lines:
      - 4
      - 4
      symbol: WIDGET_CTRL
- id: reg-baud
  section: facts
  data:
    register:
      name: WIDGET_BAUD
      offset: '0x4'
      width: 32
      access: rw
  support:
  - class: src
    anchors:
    - repo: linux
      path: drivers/tty/serial/widget.c
      lines:
      - 6
      - 6
      symbol: WIDGET_BAUD
- id: reg-lcr
  section: facts
  data:
    register:
      name: WIDGET_LCR
      offset: '0x8'
      width: 32
      access: rw
    fields:
    - id: format
      name: WIDGET_LCR_8N1
      bits:
      - 0
      - 1
      meaning: 8N1 format
  support:
  - class: src
    anchors:
    - repo: linux
      path: drivers/tty/serial/widget.c
      lines:
      - 7
      - 8
      symbol: WIDGET_LCR
- id: seq-init
  section: facts
  title: Initialization
  claim: Clear CTRL, write BAUD, write LCR, then enable CTRL.
  requirement: as-implemented
  data:
    sequence:
      steps:
      - id: s1
        action: write 0 to CTRL
        support:
        - class: src
          anchors:
          - repo: linux
            path: drivers/tty/serial/widget.c
            lines:
            - 12
            - 12
            symbol: widget_uart_init
      - id: s2
        action: write the divisor to BAUD
      - id: s3
        action: write WIDGET_LCR_8N1 to LCR
      - id: s4
        action: set WIDGET_CTRL_EN in CTRL
      order:
      - before: s2
        after: s3
        requirement: comment-explained
        support:
        - class: src
          anchors:
          - repo: linux
            path: drivers/tty/serial/widget.c
            lines:
            - 7
            - 7
            symbol: WIDGET_LCR
            comment: true
  support:
  - class: src
    anchors:
    - repo: linux
      path: drivers/tty/serial/widget.c
      lines:
      - 12
      - 15
      symbol: widget_uart_init
