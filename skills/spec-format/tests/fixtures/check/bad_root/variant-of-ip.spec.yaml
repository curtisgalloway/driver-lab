# Defect: variant_of names an ip spec, not a board.
format: 2
kind: board
id: variant-of-ip
name: Variant-Of-Ip
triggers: [variant-of-ip]
parts: [finechip]
variant_of: fineip
cache: variant-of-ip-resources
resources:
  documents:
    - {name: widget-trm, class: databook, title: Widget TRM v1.0, url: "https://example.invalid/widget-trm.pdf", pages: 80}
facts:
  - id: reset-time
    section: quick-facts
    title: Reset time
    claim: The block resets in 10 us.
    support: [{class: databook, doc: widget-trm, at: [{section: "4.2", page: "40"}]}]
