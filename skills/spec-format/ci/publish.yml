name: Publish spec views
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
env:
  TOOL_COMMIT: '0000000000000000000000000000000000000000'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require an installed tool revision
        run: test "$TOOL_COMMIT" != 0000000000000000000000000000000000000000
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          ref: ${{ github.sha }}
          persist-credentials: false
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: curtisgalloway/hardware-specs
          ref: ${{ env.TOOL_COMMIT }}
          path: tooling
          persist-credentials: false
      - name: Build pinned hwspecs renderer
        working-directory: tooling
        env:
          HWSPECS_TOOL_COMMIT: ${{ env.TOOL_COMMIT }}
        run: |
          if [ -z "${HWSPECS_BIN:-}" ] && ! command -v hwspecs >/dev/null 2>&1; then
            cargo build --release --locked
            target/release/hwspecs --version | grep -F "$TOOL_COMMIT"
            echo "HWSPECS_BIN=$PWD/target/release/hwspecs" >> "$GITHUB_ENV"
          fi
      - name: Build both views and repeat containment checks
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          VERIFY_POLICY: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dl_bin="${HWSPECS_BIN:-hwspecs}"
          "$dl_bin" publish build repo/specs --out site --source-commit "repo/specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified "$VERIFY_POLICY" --fetch-anchors
          "$dl_bin" publish check repo/specs --out site --source-commit "repo/specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified "$VERIFY_POLICY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spec-views
          path: site
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: spec-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          ref: ${{ github.sha }}
          persist-credentials: false
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: curtisgalloway/hardware-specs
          ref: ${{ env.TOOL_COMMIT }}
          path: tooling
          persist-credentials: false
      - name: Build pinned hwspecs renderer
        working-directory: tooling
        env:
          HWSPECS_TOOL_COMMIT: ${{ env.TOOL_COMMIT }}
        run: |
          if [ -z "${HWSPECS_BIN:-}" ] && ! command -v hwspecs >/dev/null 2>&1; then
            cargo build --release --locked
            target/release/hwspecs --version | grep -F "$TOOL_COMMIT"
            echo "HWSPECS_BIN=$PWD/target/release/hwspecs" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: spec-views
          path: site
      - name: Refuse incomplete or altered site before deploying
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          dl_bin="${HWSPECS_BIN:-hwspecs}"
          "$dl_bin" publish check repo/specs --out site --source-commit "repo/specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified main
      # Prepare the Pages tar locally: upload-pages-artifact nests a mutable
      # upload-artifact@v4 even when the composite itself is pinned by SHA.
      - name: Archive verified Pages site
        run: |
          tar --dereference --hard-dereference --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
