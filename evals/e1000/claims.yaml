version: 1
campaign: e1000
harness: evals/e1000/harness/l02harness.py
claims:
- id: Q01
  title: The interface's MAC is the one in the EEPROM
  mandatory: true
  cites:
  - '5.3'
  checks:
  - MAC matches QEMU's
  - MAC matches QEMU's (load 1)
  - MAC matches QEMU's (load 2)
  - MAC matches QEMU's (load 3)
  scenarios: &id001
  - smoke
  - frame-sizes
  - ring-wrap
  - rx-overrun
  - link-flap
  - link-loss-tx
  - stop-start
  - down-during-traffic
  - reload
  - itr
  scope: MAC equality only; not proof of EEPROM origin.
  defects:
  - id: d01
    run_ids:
    - e1000-l02d3-20260925-01/q1-d01-smoke
    control_runs:
    - e1000-l02d3-20260925-01/q1-ref-smoke
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  evidence:
  - evidence/L02d3.md
  - evals/e1000/RECALL-r3.md
- id: Q02
  title: Carrier comes up when the interface comes up with a link
  mandatory: true
  cites:
  - '5.9'
  - '5.10'
  - '10.3'
  checks:
  - carrier within 15 s
  - carrier within 15 s after the cycles
  - carrier within 15 s (load 1)
  - carrier within 15 s (load 2)
  - carrier within 15 s (load 3)
  scenarios: *id001
  scope: Shown after restart, not a first-bring-up defect.
  defects:
  - id: d02
    run_ids:
    - e1000-l02d3-20260925-01/q1-d02-stop-start
    control_runs:
    - e1000-l02d3-20260925-01/q1-ref-stop-start
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  evidence:
  - evidence/L02d3.md
  - evals/e1000/RECALL-r3.md
- id: Q03
  title: Frames pass both ways
  mandatory: true
  cites:
  - '6.1'
  - '6.2'
  - '10.3'
  checks:
  - DUT pings peer
  - DUT pings peer (load 1)
  - DUT pings peer (load 2)
  - DUT pings peer (load 3)
  - DUT pings peer after the cycles
  - DUT pings peer after the link returns
  - DUT pings peer after the overrun
  - DUT pings peer afterwards
  - DUT pings peer before the flood
  - DUT pings peer before the link drops
  - DUT pings peer before the traffic
  - DUT pings peer to raise interrupts
  - peer pings DUT
  - peer pings DUT (load 1)
  - peer pings DUT (load 2)
  - peer pings DUT (load 3)
  - peer pings DUT after the cycles
  - peer pings DUT after the link returns
  - peer pings DUT after the overrun
  - peer pings DUT afterwards
  - peer pings DUT before the flood
  - peer pings DUT before the link drops
  - peer pings DUT before the traffic
  - peer pings DUT to raise interrupts
  scenarios: *id001
  scope: Reused suite runs restricted to the first smoke scenario on fresh guests.
  defects:
  - id: m2
    run_ids:
    - e1000-l02d-20260924-01/mut-m2-tx-no-rs-r5
    control_runs:
    - e1000-l02d-20260924-01/r010
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  - id: m3
    run_ids:
    - e1000-l02d-20260924-01/mut-m3-irq-not-restored-r5
    control_runs:
    - e1000-l02d-20260924-01/r010
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  evidence:
  - evidence/L02d3.md
  - evals/e1000/RECALL-r3.md
- id: Q04
  title: Frames of 1513 and 1514 bytes are received
  mandatory: true
  cites:
  - '6.4'
  checks:
  - DUT pings peer with 1513-byte frames
  - DUT pings peer with 1514-byte frames
  - peer pings DUT with 1513-byte frames
  - peer pings DUT with 1514-byte frames
  scenarios:
  - frame-sizes
  scope: 1513- and 1514-byte reception, both directions.
  defects:
  - id: d03
    run_ids:
    - e1000-l02d3-20260925-01/q1-d03-frame-sizes
    control_runs:
    - e1000-l02d3-20260925-01/q1-ref-frame-sizes
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  evidence:
  - evidence/L02d3.md
  - evals/e1000/RECALL-r3.md
- id: Q05
  title: Frames of 60 to 1514 bytes are transmitted at their size
  mandatory: true
  cites:
  - '6.2'
  - '6.4'
  checks:
  - the DUT sent echo requests and replies of 60, 61, 1513 and 1514 bytes
  scenarios:
  - frame-sizes
  scope: 1514-byte transmission only; other sizes have no separate planted defect.
  defects:
  - id: d04
    run_ids:
    - e1000-l02d3-20260925-01/q1-d04-frame-sizes
    control_runs:
    - e1000-l02d3-20260925-01/q1-ref-frame-sizes
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  evidence:
  - evidence/L02d3.md
  - evals/e1000/RECALL-r3.md
- id: Q06
  title: Short frames go out padded to 60 bytes
  mandatory: true
  cites:
  - '4.5'
  - '5.7'
  - '6.4'
  checks:
  - no frame the DUT sent was shorter than 60 bytes
  - DUT pings peer with 42-byte frames
  scenarios:
  - frame-sizes
  scope: Capture detects absent padding; the peer accepts runts, so the ping alone does not.
  defects:
  - id: d05
    run_ids:
    - e1000-l02d3-20260925-01/q1-d05-frame-sizes
    control_runs:
    - e1000-l02d3-20260925-01/q1-ref-frame-sizes
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  evidence:
  - evidence/L02d3.md
  - evals/e1000/RECALL-r3.md
- id: Q07
  title: Transmission survives the transmit ring wrapping
  mandatory: true
  cites:
  - '4.5'
  - '6.2'
  - '6.3'
  checks:
  - DUT sends 1500 pings back to back, none lost
  - 4 MiB over HTTP DUT to peer arrives intact
  scenarios:
  - ring-wrap
  scope: Malformed ring geometry stops sustained transmission before a successful wrap.
  defects:
  - id: d06
    run_ids:
    - e1000-l02d3-20260925-01/q1-d06-ring-wrap
    control_runs:
    - e1000-l02d3-20260925-01/q1-ref-ring-wrap
    outcome: detected
    evidence:
    - evidence/L02d3.md#qualification
  evidence:
  - evidence/L02d3.md
  - evals/e1000/RECALL-r3.md
- id: Q08
  title: Reception survives the receive ring wrapping
  mandatory: true
  cites:
  - '4.4'
  - '6.1'
  - '6.3'
  checks:
  - peer sends 1500 pings back to back, none lost
  - 4 MiB over HTTP peer to DUT arrives intact
  scenarios:
  - ring-wrap
  scope: Failed replenishment stops reception before a successful wrap.
  defects:
  - id: m5
    run_ids:
    - e1000-l02d3-20260925-01/q1-m5-ring-wrap
    control_runs:
    - e1000-l02d3-20260925-01/q1-ref-ring-wrap
    outcome: detected
