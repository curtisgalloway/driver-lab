# SPDX-License-Identifier: <file-license>
# Domain-scoped expert stubs for one board, generated by scripts/stubgen.py. One entry per
# domain expert. Procedure and pointers only: no addresses, instance numbers, address ranges or
# register names here or in the text fields. Those are spec facts; name the spec ids instead.
format: 2
board: <board-id>
copyright: <copyright-year> <copyright-holder>
license: <file-license>
domains:
  - name: <board-id>-usb-expert
    title: <board-name> USB
    description: USB host, xHCI controller and Type-C questions on <board-name>
    entry: [<soc-id>]
    instances: [<soc-id>#<usb-instance>]
    preload: [board-expert]
    split: <board-id>-expert answers board integration (connectors, power, boot); this expert answers controller and protocol questions
  - name: <board-id>-storage-expert
    title: <board-name> storage
    description: eMMC, SD and UFS controller and boot-media questions on <board-name>
    entry: [<soc-id>]
    preload: [board-expert]
    split: <board-id>-usb-expert answers USB mass storage; this expert answers the native storage controllers
    profile: name the boot-media order and any controller quirk first, then the evidence
