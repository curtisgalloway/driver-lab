  - evals/e1000/RECALL-r3.md
- id: Q09
  title: Data arrives intact
  mandatory: true
  cites:
  - '6.1'
  - '6.2'
  - '8.4'
  checks:
  - 4 MiB over HTTP peer to DUT arrives intact
  - 4 MiB over HTTP DUT to peer arrives intact
  scenarios:
  - ring-wrap
  scope: Receive corruption detected as a stalled transfer; transmit corruption unqualified.
  defects:
  - id: d16b
    run_ids:
    - e1000-l02d3-20260925-01/q3-d16b-ring-wrap
    control_runs:
