[package]
name = "driver-lab"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "driver_lab"
path = "src/lib.rs"

[[bin]]
name = "driver-lab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comrak = { version = "0.35", default-features = false }
hex = "0.4"
jsonschema = { version = "0.29", default-features = false }
lopdf = "0.45"
regex = "1.11"
saphyr-parser = "0.2"
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.15"
toml = "0.8"
unicode-normalization = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.dev.package.driver-lab]
opt-level = 2

[profile.dev.package.saphyr-parser]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.indexmap]
opt-level = 2

[profile.dev.package.hashbrown]
opt-level = 2

