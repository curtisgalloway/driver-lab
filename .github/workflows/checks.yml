name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # This repository is public and holds evidence files written from real runs.
      - name: No private paths
        run: python3 utilities/check-no-private-paths.py

      # License split (LS-R20): outside the frozen archive, none of the moved method's terms
      # but the one README pointer line. The terms and the allowlist are in the script.
      - name: Open side only
        run: python3 utilities/check-open-side.py

      - name: utilities tests
        run: python3 -m unittest discover -s utilities/tests -v

      # The spec checkers read Markdown through peripheral-spec's mdtokens.py, pinned to
      # markdown-it-py 4.2.0; without it they exit 3 rather than fall back to another scanner.
      - name: Markdown parser dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/md"
          "$RUNNER_TEMP/md/bin/python" -m pip install markdown-it-py==4.2.0

      - name: board-expert tests
        run: '"$RUNNER_TEMP/md/bin/python" -m unittest discover -s skills/board-expert/tests -v'

      - name: peripheral-spec tests
        run: '"$RUNNER_TEMP/md/bin/python" -m unittest discover -s skills/peripheral-spec/tests -v'

      - name: hardware-investigator tests
        run: '"$RUNNER_TEMP/md/bin/python" -m unittest discover -s skills/hardware-investigator/tests -v'

      - name: board specs
        run: |
          "$RUNNER_TEMP/md/bin/python" skills/board-expert/scripts/spec_check.py \
            skills/board-expert/specs \
            --stubs-from skills

      - name: ENC28J60 YAML dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/enc28j60-tests"
          "$RUNNER_TEMP/enc28j60-tests/bin/python" -m pip install PyYAML markdown-it-py==4.2.0

      - name: enc28j60 corpus tests
        run: >-
          "$RUNNER_TEMP/enc28j60-tests/bin/python" -m unittest discover
          -s evals/enc28j60/tests -v

      # The author's manifest is what a candidate run is given. Regenerating it on every push is
      # how a corpus edit that would change what an author sees becomes visible in review.
      - name: enc28j60 author manifest
        run: >-
          "$RUNNER_TEMP/enc28j60-tests/bin/python"
          evals/enc28j60/author_manifest.py
          --check evals/enc28j60/author-manifest.yaml

      # Only the parts that need no QEMU; the harness itself runs on the test host.
      - name: e1000 QEMU harness tests
        run: python3 -m unittest discover -s evals/e1000/harness/tests -v

      - name: campaign-review tests
        run: >-
          "$RUNNER_TEMP/enc28j60-tests/bin/python" -m unittest discover
          -s skills/campaign-review/tests -v

      - name: e1000 status index
        run: >-
          "$RUNNER_TEMP/enc28j60-tests/bin/python"
          skills/campaign-review/scripts/index_check.py evals/e1000
