name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.3.0, pinned by SHA.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ubuntu-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-

      # This repository is public and holds evidence files written from real runs.
      - name: No private paths
        run: python3 utilities/check-no-private-paths.py

      # License split (LS-R20): outside the frozen archive, none of the moved method's terms
      # but the one README pointer line. The terms and the allowlist are in the script.
      - name: Open side only
        run: python3 utilities/check-open-side.py

      # No hardware facts (addresses, register names) in agent or stub prose (#156).
      - name: No hardware facts in prose
        run: python3 utilities/check-no-hardware-facts.py

      - name: utilities tests
        run: python3 -m unittest discover -s utilities/tests -v

      - name: Install bubblewrap for ENV-1 and ENV-5 sandbox checks
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Rust formatting check (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Rust lint check (cargo clippy)
        env:
          HWSPECS_TOOL_COMMIT: ${{ github.sha }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: hwspecs Rust test suite
        env:
          HWSPECS_TOOL_COMMIT: ${{ github.sha }}
        run: |
          cargo test --locked
          cargo test --locked --test test_eval -- --ignored
          HWSPECS_NET_TESTS=1 cargo test --locked --test test_ci_templates

      - name: Build hwspecs release binary and verify embedded commit
        env:
          HWSPECS_TOOL_COMMIT: ${{ github.sha }}
        run: |
          cargo build --release --locked
          target/release/hwspecs --version | grep -F "${{ github.sha }}"

      - name: board specs (hwspecs check and status)
        run: |
          target/release/hwspecs check \
            skills/board-expert/specs \
            --stubs-from skills --require-license
          target/release/hwspecs status \
            skills/board-expert/specs \
            --require-license

      - name: Read-only zero-write sandbox check (ENV-1 / RT-G)
        run: |
          tmp_corpus=$(mktemp -d)
          cp -r skills/spec-format/tests/fixtures/check/good_root/. "$tmp_corpus/"
          cp skills/spec-format/tests/fixtures/corpus/good_root.corpus.yaml "$tmp_corpus/corpus.yaml"
          tmp_repo=$(mktemp -d)
          git -C "$tmp_repo" init -q
          git -C "$tmp_repo" config user.email "test@example.invalid"
          git -C "$tmp_repo" config user.name "Test"
          mkdir -p "$tmp_repo/drivers/widget"
          cat > "$tmp_repo/drivers/widget/widget.h" <<'EOF'
          /* SPDX-License-Identifier: BSD-3-Clause */
          #define WIDGET_CTRL 0x00
          #define WIDGET_STAT 0x04
          EOF
          git -C "$tmp_repo" add drivers/widget/widget.h
          git -C "$tmp_repo" commit -q -m "init"
          pin_sha=$(git -C "$tmp_repo" rev-parse HEAD)
          tmp_src_root=$(mktemp -d)
          cat > "$tmp_src_root/board-specs.yaml" <<'EOF'
          format: 2
          layer: public
          name: env1-test
          license: Apache-2.0
          accepts: [BSD-3-Clause]
          EOF
          cat > "$tmp_src_root/widget.spec.yaml" <<EOF
          format: 2
          id: widget
          kind: ip
          name: Widget
          compatible: [vendor,widget]
          summary: Widget test spec
          resources:
            repos:
              - name: kernel
                url: https://example.invalid/kernel.git
                commit: $pin_sha
                license: BSD-3-Clause
                files:
                  - path: drivers/widget/widget.h
                    license: BSD-3-Clause
          facts:
            - id: ctrl-reg
              section: programming-model
              title: Control register offset
              claim: "WIDGET_CTRL offset is 0x00."
              support:
                - class: src
                  anchors:
                    - repo: kernel
                      path: drivers/widget/widget.h
                      lines: [1, 3]
                      symbol: WIDGET_CTRL
          EOF
          ro_run() {
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net \
              --setenv TMPDIR /nonexistent \
              --setenv HOME /nonexistent \
              "$@"
          }
          ro_run target/release/hwspecs --offline validate \
            skills/board-expert/specs/board-specs.yaml \
            skills/spec-verifier/examples/widget/widget.spec.yaml
          ro_run target/release/hwspecs --offline check \
            skills/board-expert/specs \
            --stubs-from skills --require-license
          ro_run target/release/hwspecs --offline status \
            skills/board-expert/specs \
            --require-license
          ro_run target/release/hwspecs --offline todo \
            skills/board-expert/specs \
            --require-license
          ro_run target/release/hwspecs --offline corpus \
            "$tmp_corpus" --public-skill widget-board-tools
          ro_run target/release/hwspecs --offline prose-facts \
            agents/board-expert.md
          ro_run target/release/hwspecs --offline render \
            skills/spec-verifier/examples/widget --format md >/dev/null
          ro_run target/release/hwspecs --offline render \
            skills/spec-verifier/examples/widget --format html >/dev/null
          ro_run target/release/hwspecs --offline resolve \
            "$tmp_src_root/widget.spec.yaml" --root "$tmp_src_root" --repo "kernel=$tmp_repo"
          ro_run target/release/hwspecs --offline show \
            "$tmp_src_root/widget.spec.yaml" --root "$tmp_src_root" --repo "kernel=$tmp_repo" >/dev/null
          ro_run target/release/hwspecs --offline inventory \
            "$tmp_src_root/widget.spec.yaml" --repo "kernel=$tmp_repo" >/dev/null
          rm -rf "$tmp_corpus" "$tmp_repo" "$tmp_src_root"

      - name: Frozen evaluation archive dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/evals"
          "$RUNNER_TEMP/evals/bin/python" -m pip install --require-hashes \
            -r evals/requirements.txt

      - name: site-cache tests
        run: '"$RUNNER_TEMP/evals/bin/python" -m unittest discover -s skills/site-cache/tests -v'

      - name: enc28j60 corpus tests
        run: >-
          "$RUNNER_TEMP/evals/bin/python" -m unittest discover
          -s evals/enc28j60/tests -v

      # The author's manifest is what a candidate run is given. Regenerating it on every push is
      # how a corpus edit that would change what an author sees becomes visible in review.
      - name: enc28j60 author manifest
        run: >-
          "$RUNNER_TEMP/evals/bin/python"
          evals/enc28j60/author_manifest.py
          --check evals/enc28j60/author-manifest.yaml

      # Only the parts that need no QEMU; the harness itself runs on the test host.
      - name: e1000 QEMU harness tests
        run: python3 -m unittest discover -s evals/e1000/harness/tests -v

      - name: e1000 status index
        run: |
          "$RUNNER_TEMP/evals/bin/python" evals/e1000/index_check.py evals/e1000
          target/release/hwspecs campaign index-check evals/e1000

  macos:
    runs-on: macos-latest
    steps:
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/cache v4.3.0, pinned by SHA.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-macos-

      - name: hwspecs Rust test suite (macOS)
        env:
          HWSPECS_TOOL_COMMIT: ${{ github.sha }}
        run: |
          cargo test --locked
          cargo test --locked --test test_eval -- --ignored
