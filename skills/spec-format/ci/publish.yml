name: Publish spec views
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  actions: read
env:
  TOOL_COMMIT: '0000000000000000000000000000000000000000'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require an installed tool revision
        run: test "$TOOL_COMMIT" != 0000000000000000000000000000000000000000
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: specs
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: curtisgalloway/driver-lab
          ref: ${{ env.TOOL_COMMIT }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned renderer
        run: |
          python -m venv "$RUNNER_TEMP/spec-venv"
          "$RUNNER_TEMP/spec-venv/bin/pip" install --require-hashes -r tooling/skills/spec-format/requirements.txt
      - name: Build both views and repeat containment checks
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          VERIFY_POLICY: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
        run: |
          "$RUNNER_TEMP/spec-venv/bin/python" tooling/skills/spec-format/ci/publish.py build specs --out site --source-commit "specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified "$VERIFY_POLICY"
          "$RUNNER_TEMP/spec-venv/bin/python" tooling/skills/spec-format/ci/publish.py verify specs --out site --source-commit "specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified "$VERIFY_POLICY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spec-views
          path: site
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: spec-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: specs
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: curtisgalloway/driver-lab
          ref: ${{ env.TOOL_COMMIT }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned renderer
        run: |
          python -m venv "$RUNNER_TEMP/spec-venv"
          "$RUNNER_TEMP/spec-venv/bin/pip" install --require-hashes -r tooling/skills/spec-format/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: spec-views
          path: site
      - name: Refuse incomplete or altered site before deploying
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/spec-venv/bin/python" tooling/skills/spec-format/ci/publish.py verify specs --out site --source-commit "specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified main
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
