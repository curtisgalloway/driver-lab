# A GPL-2.0-only source (synthetic license-gate fixture; format 2 of the v1 gpl-only-spec.md)
format: 2
kind: ip
id: gate-gpl-only
name: Widget block, gpl-only
triggers: [gate gpl only]
resources:
  documents:
    - {name: widget-trm, class: databook, title: Widget TRM v1.0, url: "https://example.invalid/widget-trm.pdf", pages: 80}
  repos:
    - name: linux
      url: https://example.invalid/linux
      commit: "1111111111111111111111111111111111111111"
      license: GPL-2.0-only
      files: [{path: drivers/widget.c, license_from: spdx-line}]
facts:
  - id: reset-time
    section: programming-model
    title: Reset time
    claim: The block resets in 10 us.
    support: [{class: databook, doc: widget-trm, at: [{section: "4.2", page: "40"}]}]
  - id: ctrl-offset
    section: programming-model
    title: CTRL offset
    claim: CTRL is at offset 0x10.
    support:
      - class: src
        anchors: [{repo: linux, path: drivers/widget.c, lines: [2, 2], symbol: WIDGET_CTRL}]
