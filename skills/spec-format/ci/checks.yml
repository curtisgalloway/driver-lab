name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

env:
  TOOL_COMMIT: '0000000000000000000000000000000000000000'

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The verification policy (hardware-specs design D19): pull requests must re-verify every
      # fact, including one staled through a reference into another repository; main and manual
      # runs only warn on such upstream-stale facts.
      CHECKS_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
    steps:
      - name: Require an installed tool revision
        run: test "$TOOL_COMMIT" != 0000000000000000000000000000000000000000

      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # hwspecs (spec format CLI) and the self-test's fixtures live in hardware-specs. Pinned to a
      # commit on its main branch so an upstream edit cannot change what runs here unreviewed;
      # bump the ref (and publish.yml's TOOL_COMMIT) to take a new one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: curtisgalloway/hardware-specs
          ref: ${{ env.TOOL_COMMIT }}
          path: .hwspecs
          persist-credentials: false

      # Add context-root checkouts here, and append their specs/ paths to every
      # checks.sh invocation below. See ci/README.md for the profile table.

      # Build the pinned hwspecs Rust CLI binary from Cargo.lock; checks.sh runs this binary
      # via HWSPECS_BIN.
      - name: Build pinned hwspecs CLI
        working-directory: .hwspecs
        env:
          HWSPECS_TOOL_COMMIT: ${{ env.TOOL_COMMIT }}
        run: |
          cargo build --release --locked
          target/release/hwspecs --version | grep -F "$TOOL_COMMIT"
          echo "HWSPECS_BIN=$PWD/target/release/hwspecs" >> "$GITHUB_ENV"

      - name: Root marker, specs and verification records (hwspecs check --require-license --require-verified)
        run: scripts/checks.sh --mode "$CHECKS_MODE" check .hwspecs

      - name: Source anchors at their pins (hwspecs resolve)
        run: scripts/checks.sh resolve .hwspecs
        # Fetch the pinned repositories the specs cite (below a size limit) and resolve them.
        env:
          RESOLVE_SRC: 1

      - name: Markdown view and viewer (hwspecs render --format md and html)
        run: scripts/checks.sh render .hwspecs

      # Proves the license gate with this repository's own root marker: fixture specs that do
      # not fit must fail with the gate's message, and those that fit must pass.
      - name: License-gate self-test
        run: scripts/checks.sh self-test .hwspecs
        # Also proves resolution: a real pinned repository is fetched; a good anchor must
        # resolve and a bad one fail.
        env:
          RESOLVE_SRC: 1
