name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The portability scanner lives in public-skills (agent-agnostic-skills), which points
      # at cleanroom-implementer's scripts as its worked example. Pinned to a commit so an
      # upstream edit cannot change what runs here unreviewed; bump the ref to take a new one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: curtisgalloway/public-skills
          ref: d63e3f141421fd92b89b20e6e03c321337951aa1
          path: .public-skills
          persist-credentials: false

      - name: cleanroom-implementer portability
        run: >-
          python3 .public-skills/plugins/agent-workflow/skills/agent-agnostic-skills/scripts/portability_scan.py
          skills/cleanroom-implementer/scripts

      # This repository is public and holds evidence files written from real runs.
      - name: No private paths
        run: python3 utilities/check-no-private-paths.py

      - name: os-investigator tests
        run: python3 -m unittest discover -s skills/os-investigator/tests -v

      - name: cleanroom-implementer tests
        run: python3 -m unittest discover -s skills/cleanroom-implementer/tests -v

      - name: board-expert tests
        run: python3 -m unittest discover -s skills/board-expert/tests -v

      - name: board specs
        run: |
          python3 skills/board-expert/scripts/spec_check.py \
            skills/board-expert/specs \
            --stubs-from skills

      - name: ENC28J60 YAML dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/enc28j60-tests"
          "$RUNNER_TEMP/enc28j60-tests/bin/python" -m pip install PyYAML

      - name: enc28j60 corpus tests
        run: >-
          "$RUNNER_TEMP/enc28j60-tests/bin/python" -m unittest discover
          -s evals/enc28j60/tests -v

      # The author's manifest is what a candidate run is given. Regenerating it on every push is
      # how a corpus edit that would change what an author sees becomes visible in review.
      - name: enc28j60 author manifest
        run: >-
          "$RUNNER_TEMP/enc28j60-tests/bin/python"
          evals/enc28j60/author_manifest.py
          --check evals/enc28j60/author-manifest.yaml

      # Only the parts that need no QEMU; the harness itself runs on the test host.
      - name: e1000 QEMU harness tests
        run: python3 -m unittest discover -s evals/e1000/harness/tests -v
